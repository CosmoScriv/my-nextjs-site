<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>City Search</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f5f5;
        color: #111;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-image: url('/eats.png');
        background-size: contain;
        background-position: center;
        background-repeat: no-repeat;
      }

      .page {
        width: 100%;
        max-width: 720px;
        padding: 24px;
      }

      .card {
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 20px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.14);
        backdrop-filter: blur(16px);
        padding: 24px;
      }

      .title {
        margin: 0 0 12px;
        font-size: 1.25rem;
        font-weight: 700;
      }

      .form-row {
        display: flex;
        gap: 12px;
        margin-bottom: 12px;
      }

      .field {
        flex: 1;
      }

      input {
        width: 100%;
        box-sizing: border-box;
        padding: 12px 14px;
        border: 1px solid #d4d4d8;
        border-radius: 12px;
        font-size: 0.95rem;
      }

      button {
        display: block;
        margin: 0 auto;
        padding: 12px 16px;
        border: none;
        border-radius: 12px;
        background: #18181b;
        color: white;
        font-size: 0.95rem;
        cursor: pointer;
      }

      button:hover {
        background: #3f3f46;
      }

      .results {
        margin-top: 16px;
        border: 1px solid #e4e4e7;
        border-radius: 14px;
        padding: 12px;
        background: rgba(255, 255, 255, 0.9);
      }

      .results h3 {
        margin: 0 0 10px;
        font-size: 1rem;
      }

      .results ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .results li {
        padding: 8px 0;
        border-bottom: 1px solid #e4e4e7;
      }

      .results li:last-child {
        border-bottom: none;
      }

      .error {
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 10px;
        background: #fee2e2;
        color: #991b1b;
      }

      @media (max-width: 640px) {
        .form-row {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="card">
        <h1 class="title">Find nearby restaurants</h1>
        <form id="search-form">
          <div class="form-row">
            <div class="field">
              <input id="city" name="city" type="text" value="New York" placeholder="City" />
            </div>
            <div class="field">
              <input id="state" name="state" type="text" value="NY" placeholder="State" />
            </div>
          </div>
          <button type="submit">Search</button>
        </form>

        <div id="results" class="results" style="display:none"></div>
        <div id="error" class="error" style="display:none"></div>
      </div>
    </div>

    <script>
      async function geocodeCityState(city, state) {
        const query = `${city}, ${state}`;
        const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=jsonv2&limit=1`;

        const response = await fetch(url, {
          headers: {
            'User-Agent': 'my-nextjs-site/1.0',
          },
        });

        if (!response.ok) {
          throw new Error(`Geocoding failed (${response.status})`);
        }

        const data = await response.json();
        const first = data[0];

        if (!first || !first.lat || !first.lon) {
          throw new Error('Could not find that city and state.');
        }

        return {
          latitude: Number(first.lat),
          longitude: Number(first.lon),
        };
      }

      async function searchFood(latitude, longitude) {
        const radius = 3000;
        const foodType = 'restaurant';
        const query = `[out:json][timeout:25];(nwr["amenity"="${foodType}"](around:${radius},${latitude},${longitude}););out center;`;

        const response = await fetch('https://overpass-api.de/api/interpreter', {
          method: 'POST',
          body: `data=${encodeURIComponent(query)}`,
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
          },
        });

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(`OpenStreetMap request failed (${response.status}: ${errorText.slice(0, 200)})`);
        }

        const result = await response.json();
        return (result.elements || []).slice(0, 4);
      }

      document.getElementById('search-form').addEventListener('submit', async function (event) {
        event.preventDefault();

        const city = document.getElementById('city').value.trim();
        const state = document.getElementById('state').value.trim();
        const resultsBox = document.getElementById('results');
        const errorBox = document.getElementById('error');

        resultsBox.style.display = 'none';
        errorBox.style.display = 'none';

        if (!city || !state) {
          errorBox.textContent = 'Enter both city and state.';
          errorBox.style.display = 'block';
          return;
        }

        try {
          const coordinates = await geocodeCityState(city, state);
          const places = await searchFood(coordinates.latitude, coordinates.longitude);

          if (!places.length) {
            resultsBox.innerHTML = '<h3>No restaurants found.</h3>';
          } else {
            const listItems = places
              .map((place) => {
                const name = place.tags?.name || 'Unnamed Food Spot';
                const cuisine = place.tags?.cuisine || '';
                const street = place.tags?.['addr:street'] || 'Unknown address';
                return `<li><strong>${name}</strong><br>${cuisine ? `${cuisine}<br>` : ''}${street}</li>`;
              })
              .join('');

            resultsBox.innerHTML = `<h3>Nearby restaurants</h3><ul>${listItems}</ul>`;
          }

          resultsBox.style.display = 'block';
        } catch (error) {
          errorBox.textContent = error.message || 'An error occurred';
          errorBox.style.display = 'block';
        }
      });
    </script>
  </body>
</html>
